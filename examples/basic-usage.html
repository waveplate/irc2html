<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>irc2html - Basic Usage Example</title>
  <link rel="stylesheet" href="../dist/styles.css">
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      padding: 30px;
    }
    .art-container {
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 10px;
      background: #000;
      display: inline-block;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>irc2html Usage Example</h1>

  <h2>1. Native DOM Text Mode (mIRC Color)</h2>
  <div id="irc-text-target" class="art-container"></div>

  <h2>2. Bitmap Canvas Mode (ANSI 256 / Truecolor)</h2>
  <div id="ansi-bitmap-target" class="art-container"></div>

  <script type="module">
    import { render, OutputPreview } from "../dist/index.js";

    const rawIrcArt = 
      "\x0304,01 ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ \x03\n" +
      "\x0308,01 █  \x02\x0304mIRC\x0F\x0308,01 Color & Style Art   █ \x03\n" +
      "\x0309,01 █  \x1D\x0311Italic\x0F \x1F\x0312Underline\x0F \x16\x0313Invert\x0F\x0309,01 █ \x03\n" +
      "\x0304,01 ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀ \x03";

    const rawAnsiArt = 
      "\x1b[1;38;5;214m✦ ANSI 256 / Truecolor Terminal Art ✦\x1b[0m\n" +
      "\x1b[38;2;255;50;50m██████\x1b[38;2;255;180;50m██████\x1b[38;2;50;220;50m██████\x1b[38;2;50;150;255m██████\x1b[38;2;200;50;255m██████\x1b[0m\n" +
      "\x1b[48;2;255;50;50m      \x1b[48;2;255;180;50m      \x1b[48;2;50;220;50m      \x1b[48;2;50;150;255m      \x1b[48;2;200;50;255m      \x1b[0m";

    // 1. Render in Native DOM Text Mode (default)
    render(rawIrcArt, document.getElementById("irc-text-target"), {
      fontSize: 18,
    });

    // 2. Render in Bitmap Canvas Mode
    render(rawAnsiArt, document.getElementById("ansi-bitmap-target"), {
      mode: "bitmap",
      fontSize: 18,
    });
  </script>
</body>
</html>
